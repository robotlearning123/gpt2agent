# gpt2agent configuration
# Copy to ~/.gpt2agent/config.toml and edit as needed.

# The HTTP transport is UNAUTHENTICATED and proxies your full ChatGPT account.
# Keep host on loopback. Only bind a public interface if you front it with your
# own auth/firewall — and then also set GPT2AGENT_ALLOW_REMOTE=1 in the env.
[server]
host = "127.0.0.1"
port = 9000

[models]
# Default model for the `chat` tool ("gpt-5-6" = GPT-5.6 Sol; use "gpt-6-pro"
# for the Pro tier's deepest Chat model). GPT-6 Sol/Luna slugs are Work &
# Codex-only.
chat = "gpt-5-6"

# Override the model for `agent` (default: agent-mode)
# agent = "agent-mode"

# Override the model for `deep_research_heavy` (default: gpt-6-pro)
# heavy_dr = "gpt-6-pro"

# Phase-1 browser transport (EXPERIMENTAL, chat only): drives chatgpt.com in a
# real Chrome via Playwright while the sentinel challenge blocks the
# conversation endpoint. Requires: pip install "gpt2agent[browser]".
# First run opens a headed Chrome — log in once in that window; the dedicated
# profile keeps the session afterwards.
# [browser]
# enabled = false                        # master switch for chat(browser=True)
# headed = true                          # headed Chrome is the known-good path
# timeout_s = 180                        # streaming/reply deadline (seconds)
# profile_dir = "~/.gpt2agent/chrome-profile"  # persistent Chrome profile dir
