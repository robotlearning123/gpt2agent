# gpt2agent configuration
# Copy to ~/.gpt2agent/config.toml and edit as needed.

# Version 0.0.12 supports stdio only. These fields remain for config-file
# compatibility and are not bound by the stdio transport.
[server]
host = "127.0.0.1"
port = 9000

[models]
# Default model for the `chat` tool
chat = "gpt-5-3"

# Override the model for `agent` (default: agent-mode)
# agent = "agent-mode"

# Override the model for `deep_research_heavy` (default: gpt-5-5-pro)
# heavy_dr = "gpt-5-5-pro"

# Official Grok Build CLI subscription/OAuth lane. Empty roots fail closed:
# configure at least one explicit repository root before calling Build tools.
[grok_build]
command = "grok"
# home = "~/.grok"
# auth_path = "~/.grok/auth.json"
roots = []
timeout_seconds = 120
max_output_bytes = 1048576
default_max_turns = 20
