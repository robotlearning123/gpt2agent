name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality + release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check gpt2agent tests scripts

      - name: Verify release metadata is internally consistent
        run: python scripts/verify_release.py

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install libcurl headers (Linux fallback for curl_cffi source build)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest (offline only — live tests gated by SKIP_LIVE=1)
        env:
          SKIP_LIVE: "1"
        run: pytest -q

  windows-smoke:
    name: Windows package smoke (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Import package and run module entry point
        working-directory: ${{ runner.temp }}
        run: |
          gpt2agent --version
          python -m gpt2agent --version
          python -c "import gpt2agent, gpt2agent.backend, gpt2agent.install, gpt2agent.sse"

  lint-installer:
    name: ShellCheck installer + bundled scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run shellcheck on install.sh
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        env:
          SHELLCHECK_OPTS: -e SC2086 -e SC2155
        with:
          scandir: "."
          additional_files: install.sh

  required:
    name: Required checks
    if: ${{ always() }}
    needs: [quality, test, windows-smoke, lint-installer]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          WINDOWS_RESULT: ${{ needs.windows-smoke.result }}
          SHELLCHECK_RESULT: ${{ needs.lint-installer.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$SHELLCHECK_RESULT" = success
