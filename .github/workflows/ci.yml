name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality + release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check gpt2agent tests scripts

      - name: Verify release metadata is internally consistent
        run: python scripts/verify_release.py

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Audit runtime and locked builder dependencies
        run: |
          python -m pip install --upgrade pip "pip-audit==2.10.0"
          pip-audit -r requirements.txt --progress-spinner off
          printf '%s\n' 'curl_cffi==0.15.0' | pip-audit -r /dev/stdin --no-deps --disable-pip --progress-spinner off
          pip-audit -r requirements-build.txt --no-deps --disable-pip --progress-spinner off

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install libcurl headers (Linux fallback for curl_cffi source build)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest (offline only — live tests gated by SKIP_LIVE=1)
        env:
          SKIP_LIVE: "1"
        run: pytest -q

  windows-smoke:
    name: Windows package smoke (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Import package and run module entry point
        working-directory: ${{ runner.temp }}
        run: |
          gpt2agent --version
          python -m gpt2agent --version
          python -c "import gpt2agent, gpt2agent.backend, gpt2agent.install, gpt2agent.sse"

  lint-installer:
    name: ShellCheck installer + bundled scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Run shellcheck on install.sh
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        env:
          SHELLCHECK_OPTS: -e SC2086 -e SC2155
        with:
          scandir: "."
          additional_files: install.sh

  mcp-compat:
    name: MCP compatibility (${{ matrix.lane }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: minimum
            mcp_spec: "mcp==1.26.0"
          - lane: latest-v1
            mcp_spec: "mcp>=1.26,<2"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the selected MCP compatibility boundary
        env:
          MCP_SPEC: ${{ matrix.mcp_spec }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "$MCP_SPEC"
          python -m pip check

      - name: Verify the selected MCP version
        env:
          MCP_LANE: ${{ matrix.lane }}
        run: |
          python - "$MCP_LANE" <<'PY'
          from importlib.metadata import version
          import sys

          installed = version("mcp")
          lane = sys.argv[1]
          if lane == "minimum":
              assert installed == "1.26.0", installed
          else:
              assert installed.split(".", 1)[0] == "1", installed
          PY

      - name: Run the offline suite at this MCP boundary
        env:
          SKIP_LIVE: "1"
        run: pytest -q

  package:
    name: Package dry-run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"

      - name: Install locked build toolchain
        env:
          PIP_CONFIG_FILE: /dev/null
          PIP_INDEX_URL: https://pypi.org/simple
          PIP_EXTRA_INDEX_URL: ""
          PIP_TRUSTED_HOST: ""
          PIP_FIND_LINKS: ""
          PIP_NO_INDEX: "0"
          PIP_NO_INPUT: "1"
        run: |
          set -euo pipefail
          BUILD_VENV="$RUNNER_TEMP/gpt2agent-build"
          rm -rf "$BUILD_VENV"
          python -m venv "$BUILD_VENV"
          "$BUILD_VENV/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements-build.txt --no-cache-dir
          "$BUILD_VENV/bin/python" -m pip check
          "$BUILD_VENV/bin/python" -m pip --version
          "$BUILD_VENV/bin/python" - <<'PY'
          from importlib.metadata import version

          for distribution in ("build", "twine", "setuptools", "wheel"):
              print(f"{distribution}=={version(distribution)}")
          PY
          echo "BUILD_VENV=$BUILD_VENV" >> "$GITHUB_ENV"

      - name: Build and validate distributions
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          export SOURCE_DATE_EPOCH PYTHONHASHSEED=0 TZ=UTC
          printf 'SOURCE_DATE_EPOCH=%s\nPYTHONHASHSEED=%s\nTZ=%s\n' \
            "$SOURCE_DATE_EPOCH" "$PYTHONHASHSEED" "$TZ"
          "$BUILD_VENV/bin/python" -m build --no-isolation
          "$BUILD_VENV/bin/python" -m twine check --strict dist/*

      - name: Test wheel and sdist in clean environments
        run: |
          PROJECT_VERSION="$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              print(tomllib.load(stream)["project"]["version"])
          PY
          )"
          DIST_VERSION="$(python scripts/verify_release.py --print-distribution-version)"
          scripts/package_smoke.sh dist "$PROJECT_VERSION" "$DIST_VERSION"

      - name: Retain exact main-CI release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          overwrite: false
          if-no-files-found: error
          retention-days: 90

  required:
    name: Required checks
    if: ${{ always() }}
    needs: [quality, dependency-audit, test, windows-smoke, lint-installer, mcp-compat, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          TEST_RESULT: ${{ needs.test.result }}
          WINDOWS_RESULT: ${{ needs.windows-smoke.result }}
          SHELLCHECK_RESULT: ${{ needs.lint-installer.result }}
          MCP_COMPAT_RESULT: ${{ needs.mcp-compat.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$DEPENDENCY_AUDIT_RESULT" = success
          test "$TEST_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$SHELLCHECK_RESULT" = success
          test "$MCP_COMPAT_RESULT" = success
          test "$PACKAGE_RESULT" = success
