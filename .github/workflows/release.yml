name: Release

# Triggers on tag pushes that look like v1.2.3 — typical SemVer.
# Validates and publishes the exact account-tested main-CI wheel + sdist via
# OIDC trusted publishing, then creates a GitHub release with the matching
# CHANGELOG section as body. It never rebuilds release distributions.
#
# One-time PyPI setup (no secrets needed):
#   https://docs.pypi.org/trusted-publishers/
#   Workflow name: release.yml, Environment name: pypi

on:
  push:
    tags:
      # SemVer-shaped tags only: v0.0.2, v1.2.3, v0.0.2-rc1, …
      # Avoids firing on 'v' alone, 'vfoo', 'vlatest', etc.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source and metadata
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      distribution_version: ${{ steps.metadata.outputs.distribution_version }}
      tag_object: ${{ steps.provenance.outputs.tag_object }}
      commit: ${{ steps.provenance.outputs.commit }}
      tree: ${{ steps.provenance.outputs.tree }}
      receipt_sha256: ${{ steps.provenance.outputs.receipt_sha256 }}
      account_artifact_set_sha256: ${{ steps.provenance.outputs.account_artifact_set_sha256 }}
      candidate_run_id: ${{ steps.provenance.outputs.candidate_run_id }}
      candidate_run_attempt: ${{ steps.provenance.outputs.candidate_run_attempt }}
      candidate_artifact_id: ${{ steps.provenance.outputs.candidate_artifact_id }}
      candidate_artifact_digest: ${{ steps.provenance.outputs.candidate_artifact_digest }}
      candidate_artifact_size: ${{ steps.provenance.outputs.candidate_artifact_size }}
      candidate_artifact_expires_at: ${{ steps.provenance.outputs.candidate_artifact_expires_at }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Require the tagged commit to be on origin/main
        id: provenance
        run: |
          set -euo pipefail
          VERIFY_REF="refs/release-verification/tag"
          git fetch --force --no-tags origin "$GITHUB_REF:$VERIFY_REF"
          if [ "$(git cat-file -t "$VERIFY_REF")" != tag ]; then
            echo "::error::Release ref $GITHUB_REF must be an annotated tag"
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse "$VERIFY_REF^{}")"
          if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::Release tag $GITHUB_REF resolves to $TAG_COMMIT, not event SHA $GITHUB_SHA"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Release tag commit $TAG_COMMIT is not reachable from origin/main"
            exit 1
          fi
          TAG_MESSAGE="$(git for-each-ref --format="%(contents)" "$VERIFY_REF")"
          tag_field() {
            LABEL="${1%:}"
            MATCHES="$(printf '%s\n' "$TAG_MESSAGE" | grep "^${LABEL}:" || true)"
            MATCH_COUNT="$(printf '%s\n' "$MATCHES" | grep -c . || true)"
            if [ "$MATCH_COUNT" -ne 1 ] || [ "${MATCHES#"$LABEL: "}" = "$MATCHES" ]; then
              echo "::error::Annotated release tag must contain exactly one $LABEL field"
              exit 1
            fi
            TAG_VALUE="${MATCHES#"$LABEL: "}"
          }
          tag_field account-receipt-sha256:
          RECEIPT_SHA256="$TAG_VALUE"
          tag_field account-artifact-set-sha256:
          ACCOUNT_ARTIFACT_SET_SHA256="$TAG_VALUE"
          tag_field account-ci-run-id:
          CANDIDATE_RUN_ID="$TAG_VALUE"
          tag_field account-ci-run-attempt:
          CANDIDATE_RUN_ATTEMPT="$TAG_VALUE"
          tag_field account-ci-artifact-id:
          CANDIDATE_ARTIFACT_ID="$TAG_VALUE"
          tag_field account-ci-artifact-digest:
          CANDIDATE_ARTIFACT_DIGEST="$TAG_VALUE"
          tag_field account-ci-artifact-size:
          CANDIDATE_ARTIFACT_SIZE="$TAG_VALUE"
          tag_field account-ci-artifact-expires-at:
          CANDIDATE_ARTIFACT_EXPIRES_AT="$TAG_VALUE"
          if ! [[ "$RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Account receipt SHA-256 must be 64 lowercase hex characters"
            exit 1
          fi
          if ! [[ "$ACCOUNT_ARTIFACT_SET_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Account artifact-set SHA-256 must be 64 lowercase hex characters"
            exit 1
          fi
          if ! [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]] ||
             ! [[ "$CANDIDATE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] ||
             ! [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] ||
             ! [[ "$CANDIDATE_ARTIFACT_SIZE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Account CI numeric identity fields must be positive integers"
            exit 1
          fi
          if ! [[ "$CANDIDATE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Account CI artifact digest is malformed"
            exit 1
          fi
          if ! [[ "$CANDIDATE_ARTIFACT_EXPIRES_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$ ]]; then
            echo "::error::Account CI artifact expiry is malformed"
            exit 1
          fi
          {
            echo "tag_object=$(git rev-parse "$VERIFY_REF")"
            echo "commit=$TAG_COMMIT"
            echo "tree=$(git rev-parse "$TAG_COMMIT^{tree}")"
            echo "receipt_sha256=$RECEIPT_SHA256"
            echo "account_artifact_set_sha256=$ACCOUNT_ARTIFACT_SET_SHA256"
            echo "candidate_run_id=$CANDIDATE_RUN_ID"
            echo "candidate_run_attempt=$CANDIDATE_RUN_ATTEMPT"
            echo "candidate_artifact_id=$CANDIDATE_ARTIFACT_ID"
            echo "candidate_artifact_digest=$CANDIDATE_ARTIFACT_DIGEST"
            echo "candidate_artifact_size=$CANDIDATE_ARTIFACT_SIZE"
            echo "candidate_artifact_expires_at=$CANDIDATE_ARTIFACT_EXPIRES_AT"
          } >> "$GITHUB_OUTPUT"

      - name: Verify tag, manifests, and changelog
        id: metadata
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          python scripts/verify_release.py --tag "$GITHUB_REF_NAME"
          DIST_VERSION="$(python scripts/verify_release.py --tag "$GITHUB_REF_NAME" --print-distribution-version)"
          {
            echo "version=$TAG_VERSION"
            echo "distribution_version=$DIST_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Require successful main CI for the exact tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/verify_main_ci.py
          --repository "$GITHUB_REPOSITORY"
          --commit "${{ steps.provenance.outputs.commit }}"
          --expected-run-id "${{ steps.provenance.outputs.candidate_run_id }}"
          --expected-run-attempt "${{ steps.provenance.outputs.candidate_run_attempt }}"
          --expected-artifact-id "${{ steps.provenance.outputs.candidate_artifact_id }}"
          --expected-artifact-digest "${{ steps.provenance.outputs.candidate_artifact_digest }}"
          --expected-artifact-size "${{ steps.provenance.outputs.candidate_artifact_size }}"
          --expected-artifact-expires-at "${{ steps.provenance.outputs.candidate_artifact_expires_at }}"
          --minimum-artifact-lifetime-hours 1 --attempts 180 --delay 10

  test:
    name: Tests must pass before publish
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install libcurl headers (Linux fallback for curl_cffi)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: SKIP_LIVE=1 pytest -q

  build:
    name: Validate and relay exact wheel + sdist
    needs: [verify, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"

      - name: Install locked validation toolchain
        env:
          PIP_CONFIG_FILE: /dev/null
          PIP_INDEX_URL: https://pypi.org/simple
          PIP_EXTRA_INDEX_URL: ""
          PIP_TRUSTED_HOST: ""
          PIP_FIND_LINKS: ""
          PIP_NO_INDEX: "0"
          PIP_NO_INPUT: "1"
        run: |
          set -euo pipefail
          BUILD_VENV="$RUNNER_TEMP/gpt2agent-build"
          rm -rf "$BUILD_VENV"
          python -m venv "$BUILD_VENV"
          "$BUILD_VENV/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements-build.txt --no-cache-dir
          "$BUILD_VENV/bin/python" -m pip check
          "$BUILD_VENV/bin/python" -m pip --version
          "$BUILD_VENV/bin/python" - <<'PY'
          from importlib.metadata import version

          for distribution in ("build", "twine", "setuptools", "wheel"):
              print(f"{distribution}=={version(distribution)}")
          PY
          echo "BUILD_VENV=$BUILD_VENV" >> "$GITHUB_ENV"

      - name: Download the exact account-tested main-CI artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.verify.outputs.candidate_artifact_id }}
          path: dist/
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify.outputs.candidate_run_id }}
          merge-multiple: true

      - name: Verify the exact account-tested artifact handoff
        env:
          SOURCE_COMMIT: ${{ needs.verify.outputs.commit }}
          SOURCE_TREE: ${{ needs.verify.outputs.tree }}
          ACCOUNT_ARTIFACT_SET_SHA256: ${{ needs.verify.outputs.account_artifact_set_sha256 }}
          CANDIDATE_RUN_ID: ${{ needs.verify.outputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ needs.verify.outputs.candidate_run_attempt }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.verify.outputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.verify.outputs.candidate_artifact_digest }}
          CANDIDATE_ARTIFACT_SIZE: ${{ needs.verify.outputs.candidate_artifact_size }}
          CANDIDATE_ARTIFACT_EXPIRES_AT: ${{ needs.verify.outputs.candidate_artifact_expires_at }}
        run: |
          python scripts/release_evidence.py verify-account-handoff \
            --dist dist \
            --commit "$SOURCE_COMMIT" \
            --tree "$SOURCE_TREE" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$CANDIDATE_RUN_ID" \
            --run-attempt "$CANDIDATE_RUN_ATTEMPT" \
            --artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --artifact-digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --artifact-size "$CANDIDATE_ARTIFACT_SIZE" \
            --artifact-expires-at "$CANDIDATE_ARTIFACT_EXPIRES_AT" \
            --artifact-set-sha256 "$ACCOUNT_ARTIFACT_SET_SHA256"

      - name: Twine check
        run: |
          "$BUILD_VENV/bin/python" -m twine check --strict dist/*

      - name: Require the PyPI version to be absent before publication
        env:
          VERSION: ${{ needs.verify.outputs.distribution_version }}
        run: >-
          python scripts/verify_pypi_artifacts.py --version "$VERSION"
          --dist dist --require-absent --attempts 3 --delay 5

      - name: Bind artifacts to tag, source, and account receipt evidence
        env:
          TAG_OBJECT: ${{ needs.verify.outputs.tag_object }}
          SOURCE_COMMIT: ${{ needs.verify.outputs.commit }}
          SOURCE_TREE: ${{ needs.verify.outputs.tree }}
          RECEIPT_SHA256: ${{ needs.verify.outputs.receipt_sha256 }}
          ACCOUNT_ARTIFACT_SET_SHA256: ${{ needs.verify.outputs.account_artifact_set_sha256 }}
          CANDIDATE_RUN_ID: ${{ needs.verify.outputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ needs.verify.outputs.candidate_run_attempt }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.verify.outputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.verify.outputs.candidate_artifact_digest }}
          CANDIDATE_ARTIFACT_SIZE: ${{ needs.verify.outputs.candidate_artifact_size }}
          CANDIDATE_ARTIFACT_EXPIRES_AT: ${{ needs.verify.outputs.candidate_artifact_expires_at }}
        run: |
          python scripts/release_evidence.py create \
            --dist dist \
            --output release-evidence/release-workflow-artifacts.json \
            --tag "$GITHUB_REF_NAME" \
            --tag-object "$TAG_OBJECT" \
            --commit "$SOURCE_COMMIT" \
            --tree "$SOURCE_TREE" \
            --receipt-sha256 "$RECEIPT_SHA256" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-run-attempt "$CANDIDATE_RUN_ATTEMPT" \
            --candidate-artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --candidate-artifact-size "$CANDIDATE_ARTIFACT_SIZE" \
            --candidate-artifact-expires-at "$CANDIDATE_ARTIFACT_EXPIRES_AT" \
            --account-artifact-set-sha256 "$ACCOUNT_ARTIFACT_SET_SHA256" \
            --job build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          overwrite: true
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence
          path: release-evidence/release-workflow-artifacts.json
          overwrite: true
          if-no-files-found: error

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gpt2agent
    permissions:
      actions: read
      id-token: write   # OIDC for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          # Supports retries of failed jobs in this same run, which reuse the
          # original build artifact. A rebuilt workflow cannot pass the
          # pre-publish version-absence gate after any file reaches PyPI.
          skip-existing: true

  verify-pypi:
    name: Verify published PyPI artifacts
    needs: [pypi-publish, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence
          path: release-evidence/
      - name: Match every published filename and SHA-256
        env:
          VERSION: ${{ needs.verify.outputs.distribution_version }}
        run: >-
          python scripts/verify_pypi_artifacts.py --version "$VERSION"
          --dist dist --require-complete --attempts 7 --delay 10

      - name: Verify release workflow evidence
        env:
          TAG_OBJECT: ${{ needs.verify.outputs.tag_object }}
          SOURCE_COMMIT: ${{ needs.verify.outputs.commit }}
          SOURCE_TREE: ${{ needs.verify.outputs.tree }}
          RECEIPT_SHA256: ${{ needs.verify.outputs.receipt_sha256 }}
          ACCOUNT_ARTIFACT_SET_SHA256: ${{ needs.verify.outputs.account_artifact_set_sha256 }}
          CANDIDATE_RUN_ID: ${{ needs.verify.outputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ needs.verify.outputs.candidate_run_attempt }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.verify.outputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.verify.outputs.candidate_artifact_digest }}
          CANDIDATE_ARTIFACT_SIZE: ${{ needs.verify.outputs.candidate_artifact_size }}
          CANDIDATE_ARTIFACT_EXPIRES_AT: ${{ needs.verify.outputs.candidate_artifact_expires_at }}
        run: |
          python scripts/release_evidence.py verify \
            --manifest release-evidence/release-workflow-artifacts.json \
            --dist dist \
            --tag "$GITHUB_REF_NAME" \
            --tag-object "$TAG_OBJECT" \
            --commit "$SOURCE_COMMIT" \
            --tree "$SOURCE_TREE" \
            --receipt-sha256 "$RECEIPT_SHA256" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-run-attempt "$CANDIDATE_RUN_ATTEMPT" \
            --candidate-artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --candidate-artifact-size "$CANDIDATE_ARTIFACT_SIZE" \
            --candidate-artifact-expires-at "$CANDIDATE_ARTIFACT_EXPIRES_AT" \
            --account-artifact-set-sha256 "$ACCOUNT_ARTIFACT_SET_SHA256"

  pypi-canary:
    name: Verify PyPI install in a clean environment
    needs: [verify-pypi, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the published release from PyPI
        working-directory: ${{ runner.temp }}
        env:
          DIST_VERSION: ${{ needs.verify.outputs.distribution_version }}
          PROJECT_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          python -m venv pypi-canary
          pypi-canary/bin/python -m pip install --upgrade pip
          installed=false
          for attempt in 1 2 3 4 5 6 7; do
            if pypi-canary/bin/python -m pip install --no-cache-dir \
              --index-url https://pypi.org/simple "gpt2agent==$DIST_VERSION"; then
              installed=true
              break
            fi
            if [ "$attempt" -lt 7 ]; then sleep 10; fi
          done
          test "$installed" = true
          pypi-canary/bin/python -m pip check
          test "$(pypi-canary/bin/gpt2agent --version)" = "gpt2agent $PROJECT_VERSION"
          test "$(pypi-canary/bin/python -m gpt2agent --version)" = "gpt2agent $PROJECT_VERSION"
          pypi-canary/bin/python - "$DIST_VERSION" <<'PY'
          from importlib.metadata import version
          from importlib.resources import files
          from importlib.util import find_spec
          import json
          import re
          import sys

          assert version("gpt2agent") == sys.argv[1]
          match = re.match(r"^(\d+)\.(\d+)\.(\d+)", sys.argv[1])
          assert match is not None
          requires_account_manifest = tuple(map(int, match.groups())) >= (0, 0, 12)
          root = files("gpt2agent")
          assert root.joinpath("skills/deep-research/SKILL.md").is_file()
          assert root.joinpath("skills/gpt2agent/SKILL.md").is_file()
          manifest_spec = find_spec("gpt2agent.tool_manifest")
          if requires_account_manifest:
              assert manifest_spec is not None
          if manifest_spec is not None:
              from gpt2agent.tool_manifest import TOOL_NAMES

              assert len(TOOL_NAMES) == 32
              assert len(set(TOOL_NAMES)) == 32
          resources_dir = root.joinpath("resources")
          if requires_account_manifest:
              assert resources_dir.is_dir()
          if resources_dir.is_dir():
              for name in ("feature-coverage.v1.json", "update-evidence.v1.json"):
                  payload = json.loads(
                      resources_dir.joinpath(name).read_text(encoding="utf-8")
                  )
                  assert payload["schema_version"] == "1"
          PY

  prepare-release-notes:
    name: Prepare exact GitHub Release notes
    needs: [pypi-canary, verify]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Extract the exact CHANGELOG section
        run: |
          set -euo pipefail
          mkdir -p release-notes
          python scripts/verify_release.py --print-changelog-section \
            --tag "$GITHUB_REF_NAME" > release-notes/release_notes.md
          test -s release-notes/release_notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes-${{ github.run_id }}
          path: release-notes/release_notes.md
          overwrite: true
          if-no-files-found: error

  github-release-draft:
    name: Create complete GitHub Release draft
    needs: [prepare-release-notes, verify]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: ${{ runner.temp }}/github-release-${{ github.run_id }}-${{ github.run_attempt }}/dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence
          path: ${{ runner.temp }}/github-release-${{ github.run_id }}-${{ github.run_attempt }}/release-evidence/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes-${{ github.run_id }}
          path: ${{ runner.temp }}/github-release-${{ github.run_id }}-${{ github.run_attempt }}/notes/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/github-release-${{ github.run_id }}-${{ github.run_attempt }}/notes/release_notes.md
          files: |
            ${{ runner.temp }}/github-release-${{ github.run_id }}-${{ github.run_attempt }}/dist/gpt2agent-${{ needs.verify.outputs.distribution_version }}-py3-none-any.whl
            ${{ runner.temp }}/github-release-${{ github.run_id }}-${{ github.run_attempt }}/dist/gpt2agent-${{ needs.verify.outputs.distribution_version }}.tar.gz
            ${{ runner.temp }}/github-release-${{ github.run_id }}-${{ github.run_attempt }}/release-evidence/release-workflow-artifacts.json
          fail_on_unmatched_files: true
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}

  github-release:
    name: Publish immutable GitHub Release
    needs: [github-release-draft, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the complete draft
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}

  verify-github-release:
    name: Verify public GitHub Release bytes
    needs: [github-release, prepare-release-notes, verify]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: ${{ runner.temp }}/github-release-verify-${{ github.run_id }}-${{ github.run_attempt }}/dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence
          path: ${{ runner.temp }}/github-release-verify-${{ github.run_id }}-${{ github.run_attempt }}/release-evidence/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes-${{ github.run_id }}
          path: ${{ runner.temp }}/github-release-verify-${{ github.run_id }}-${{ github.run_attempt }}/notes/
      - name: Read back exact public release body and assets
        run: >-
          python scripts/verify_github_release.py
          --repository "$GITHUB_REPOSITORY"
          --tag "$GITHUB_REF_NAME"
          --notes "${{ runner.temp }}/github-release-verify-${{ github.run_id }}-${{ github.run_attempt }}/notes/release_notes.md"
          --dist "${{ runner.temp }}/github-release-verify-${{ github.run_id }}-${{ github.run_attempt }}/dist"
          --evidence "${{ runner.temp }}/github-release-verify-${{ github.run_id }}-${{ github.run_attempt }}/release-evidence/release-workflow-artifacts.json"
          --download-root "${{ runner.temp }}/github-release-verify-${{ github.run_id }}-${{ github.run_attempt }}/public-assets"
          --expected-prerelease "${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}"
          --attempts 7 --delay 10
