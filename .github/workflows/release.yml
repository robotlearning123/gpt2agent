name: Release

# Triggers on tag pushes that look like v1.2.3 — typical SemVer.
# Builds wheel + sdist, publishes to PyPI via OIDC trusted publishing, and
# creates a GitHub release with the matching CHANGELOG section as body.
#
# One-time PyPI setup (no secrets needed):
#   https://docs.pypi.org/trusted-publishers/
#   Workflow name: release.yml, Environment name: pypi

on:
  push:
    tags:
      # SemVer-shaped tags only: v0.0.2, v1.2.3, v0.0.2-rc1, …
      # Avoids firing on 'v' alone, 'vfoo', 'vlatest', etc.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source and metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      distribution_version: ${{ steps.metadata.outputs.distribution_version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Require the tagged commit to be on origin/main
        run: |
          set -euo pipefail
          VERIFY_REF="refs/release-verification/tag"
          git fetch --force --no-tags origin "$GITHUB_REF:$VERIFY_REF"
          if [ "$(git cat-file -t "$VERIFY_REF")" != tag ]; then
            echo "::error::Release ref $GITHUB_REF must be an annotated tag"
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse "$VERIFY_REF^{}")"
          if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::Release tag $GITHUB_REF resolves to $TAG_COMMIT, not event SHA $GITHUB_SHA"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Release tag commit $TAG_COMMIT is not reachable from origin/main"
            exit 1
          fi

      - name: Verify tag, manifests, and changelog
        id: metadata
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          python scripts/verify_release.py --tag "$GITHUB_REF_NAME"
          DIST_VERSION="$(python scripts/verify_release.py --tag "$GITHUB_REF_NAME" --print-distribution-version)"
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "distribution_version=$DIST_VERSION" >> "$GITHUB_OUTPUT"

  test:
    name: Tests must pass before publish
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install libcurl headers (Linux fallback for curl_cffi)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: SKIP_LIVE=1 pytest -q

  build:
    name: Build and test wheel + sdist
    needs: [verify, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - name: Build wheel and sdist
        run: python -m build
      - name: Twine check
        run: |
          python -m pip install twine
          twine check dist/*

      - name: Test built artifacts in clean environments
        env:
          PROJECT_VERSION: ${{ needs.verify.outputs.version }}
          DIST_VERSION: ${{ needs.verify.outputs.distribution_version }}
        run: |
          set -euo pipefail
          TMP_ROOT=$(mktemp -d)
          trap 'rm -rf "$TMP_ROOT"' EXIT
          WHEEL=$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)
          SDIST=$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$WHEEL"
          test -n "$SDIST"

          python -m venv "$TMP_ROOT/wheel-venv"
          "$TMP_ROOT/wheel-venv/bin/python" -m pip install --upgrade pip
          "$TMP_ROOT/wheel-venv/bin/python" -m pip install "$WHEEL"
          "$TMP_ROOT/wheel-venv/bin/python" -m pip check
          (
            cd "$TMP_ROOT"
            test "$("$TMP_ROOT/wheel-venv/bin/gpt2agent" --version)" = "gpt2agent $PROJECT_VERSION"
            test "$("$TMP_ROOT/wheel-venv/bin/python" -m gpt2agent --version)" = "gpt2agent $PROJECT_VERSION"
            "$TMP_ROOT/wheel-venv/bin/python" - "$DIST_VERSION" <<'PY'
          from importlib.metadata import version
          from importlib.resources import files
          import sys

          expected_distribution = sys.argv[1]
          assert version("gpt2agent") == expected_distribution
          root = files("gpt2agent")
          required = [
              "skills/deep-research/SKILL.md",
              "skills/deep-research/bin/deep_research.py",
              "skills/deep-research/bin/quota.sh",
              "skills/deep-research/bin/run.sh",
              "skills/gpt2agent/SKILL.md",
              "skills/gpt2agent/tools-reference.md",
          ]
          assert all(root.joinpath(path).is_file() for path in required)
          PY
          )
          mkdir -p "$TMP_ROOT/home"
          HOME="$TMP_ROOT/home" "$TMP_ROOT/wheel-venv/bin/gpt2agent" install --client claude-code
          test -f "$TMP_ROOT/home/.claude/skills/deep-research/SKILL.md"
          if find "$TMP_ROOT/home/.claude/skills" -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit | grep -q .; then
            echo "::error::Installed skills contain generated bytecode"
            exit 1
          fi

          mkdir -p "$TMP_ROOT/sdist"
          tar -xzf "$SDIST" -C "$TMP_ROOT/sdist"
          SDIST_ROOT=$(find "$TMP_ROOT/sdist" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -f "$SDIST_ROOT/tests/fixtures/heavy_dr_conversation_detail_h2.json"
          test -f "$SDIST_ROOT/tests/fixtures/heavy_dr_widget_state.json"
          python -m venv "$TMP_ROOT/sdist-venv"
          "$TMP_ROOT/sdist-venv/bin/python" -m pip install --upgrade pip
          "$TMP_ROOT/sdist-venv/bin/python" -m pip install "$SDIST" pytest pytest-asyncio
          (
            cd "$SDIST_ROOT"
            SKIP_LIVE=1 "$TMP_ROOT/sdist-venv/bin/python" -m pytest -q \
              tests/test_heavy_dr_parser.py
          )

      - name: Require the PyPI version to be absent before publication
        env:
          VERSION: ${{ needs.verify.outputs.distribution_version }}
        run: >-
          python scripts/verify_pypi_artifacts.py --version "$VERSION"
          --dist dist --require-absent --attempts 3 --delay 5

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gpt2agent
    permissions:
      id-token: write   # OIDC for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          # Supports retries of failed jobs in this same run, which reuse the
          # original build artifact. A rebuilt workflow cannot pass the
          # pre-publish version-absence gate after any file reaches PyPI.
          skip-existing: true

  verify-pypi:
    name: Verify published PyPI artifacts
    needs: [pypi-publish, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Match every published filename and SHA-256
        env:
          VERSION: ${{ needs.verify.outputs.distribution_version }}
        run: >-
          python scripts/verify_pypi_artifacts.py --version "$VERSION"
          --dist dist --require-complete --attempts 7 --delay 10

  github-release:
    name: Create GitHub Release
    needs: [verify-pypi, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Extract CHANGELOG section for this version
        id: changelog
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" '
            BEGIN { p = 0 }
            /^## \[/{
              if (p) exit
              if ($0 ~ "## \\[" ver "\\]") { p = 1; print; next }
            }
            p { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          echo "----- release notes -----"
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: release_notes.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
